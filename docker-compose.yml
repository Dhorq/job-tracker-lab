services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - jobtracker-db-data:/var/lib/postgresql/data
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672" # port AMQP
      - "15672:15672" # port Management UI

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/jobtracker?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      - db
      - rabbitmq

volumes:
  jobtracker-db-data: